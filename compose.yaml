services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: simple_games
      POSTGRES_USER: simple_games
      POSTGRES_PASSWORD: simple_games
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U simple_games -d simple_games"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  postgres_data:

<div class="shell">
  <a class="skip-link" href="#main-content">{{ i18n.t('skipToContent') }}</a>
  <header class="topbar">
    <a class="brand" routerLink="/" [attr.aria-label]="i18n.t('brandName')">
      <span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 32 32" fill="none"><path d="M9 17c2-6 12-6 14 0l3 6c2 6-6 5-10 3-4 2-12 3-10-3Z" fill="currentColor"/><ellipse cx="7" cy="12" rx="3" ry="4" fill="currentColor" transform="rotate(-25 7 12)"/><ellipse cx="14" cy="7" rx="3" ry="4" fill="currentColor"/><ellipse cx="22" cy="8" rx="3" ry="4" fill="currentColor" transform="rotate(15 22 8)"/><ellipse cx="27" cy="15" rx="2.7" ry="3.6" fill="currentColor" transform="rotate(30 27 15)"/></svg></span>
      <span>{{ i18n.t('brandName') }}<small>{{ i18n.t('brandTagline') }}</small></span>
    </a>
    <nav class="nav-actions" [attr.aria-label]="i18n.t('mainNavigation')">
      <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }" ariaCurrentWhenActive="page">{{ i18n.t('homeNav') }}</a>
      <a routerLink="/games/pocket-pet" routerLinkActive="active" ariaCurrentWhenActive="page">{{ i18n.t('pocketPetNav') }}</a>
      <a routerLink="/profile" routerLinkActive="active" ariaCurrentWhenActive="page">{{ i18n.t('petProfile') }}</a>
    </nav>
    <app-settings-menu />
  </header>
  <main id="main-content" tabindex="-1"><router-outlet /></main>
  <footer class="site-footer"><span>{{ i18n.t('brandName') }}</span><p>{{ i18n.t('footerNote') }}</p><span class="footer-leaf" aria-hidden="true">✳</span></footer>
</div>
